# Daily: pull new tournaments from Limitless and commit them to data/raw/ (the cache the site is built from).
name: Update data
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      since: { description: 'Override the start date (YYYY-MM-DD); default is the last rotation', default: '' }

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch online tournaments (Limitless Play API)
        continue-on-error: true
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
        run: npm run fetch:online ${{ inputs.since && format('-- --since {0}', inputs.since) || '' }}
      - name: Fetch in-person tournaments (limitlesstcg.com)
        continue-on-error: true
        run: npm run fetch:offline ${{ inputs.since && format('-- --since {0}', inputs.since) || '' }}
      - name: Refresh card prices (TCGplayer / Cardmarket via Limitless) and exchange rates
        continue-on-error: true
        run: npm run fetch:prices
      - name: Check the dataset builds
        run: npm run build:data
      - name: Commit raw data
        run: |
          git add data/raw
          if git diff --cached --quiet; then echo "No new tournaments"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tournament data $(date -u +%F)"
          # main may have moved while fetching; data/raw only gains new files, so a rebase is safe.
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

# Hourly: pull new tournaments from Limitless and commit them to data/raw/ (the cache the site is built from).
# Card prices refresh once a day (when prices.json is over 20 hours old), or when a manual run asks for it.
# The site is redeployed only when something was committed. Started by GitHub's schedule and, more reliably,
# by an external hourly trigger (see CLAUDE.md).
name: Update data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      since: { description: 'Override the start date (YYYY-MM-DD); default is the last rotation', default: '' }
      prices: { description: 'Refresh card prices even if they are less than 20 hours old', type: boolean, default: false }

permissions:
  contents: write
  actions: write   # to start the Deploy workflow after a data commit

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Always start from the newest main: a run that waited in the queue would otherwise check out the
      # commit that was current when it was queued, and conflict with the runs that finished before it.
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch online tournaments (Limitless Play API)
        continue-on-error: true
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
        run: npm run fetch:online ${{ inputs.since && format('-- --since {0}', inputs.since) || '' }}
      - name: Fetch in-person tournaments (limitlesstcg.com)
        continue-on-error: true
        run: npm run fetch:offline ${{ inputs.since && format('-- --since {0}', inputs.since) || '' }}
      - name: Decide whether prices are due
        id: prices
        run: |
          if [ "${{ inputs.prices }}" = "true" ] || ! node -e "
            const f = JSON.parse(require('fs').readFileSync('data/raw/prices.json', 'utf8'));
            process.exit(Date.now() - Date.parse(f.fetchedAt) < 20 * 3600e3 ? 0 : 1)"; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh card prices (TCGplayer / Cardmarket via Limitless) and exchange rates
        if: steps.prices.outputs.due == 'true'
        continue-on-error: true
        run: npm run fetch:prices
      - name: Check the dataset builds
        run: npm run build:data
      - name: Commit raw data and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/raw
          if git diff --cached --quiet; then echo "Nothing new, no deploy needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tournament data $(date -u +%F)"
          # main may have moved while fetching, so rebase onto it before pushing.
          for i in 1 2 3 4; do
            # -X theirs: if main changed the same data files meanwhile (prices.json is rewritten each time),
            # keep the newly fetched version.
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              # A push with the workflow token doesn't start other workflows, so start the deploy directly.
              gh workflow run deploy.yml --ref main
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

# Daily: pull new tournaments from Limitless, commit the raw cache, rebuild and deploy to GitHub Pages.
name: Update data & deploy
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      online_days: { description: 'Online look-back (days)', default: '60' }
      offline_days: { description: 'In-person look-back (days)', default: '365' }
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

      - name: Fetch online tournaments (Limitless Play API)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
        run: npm run fetch:online -- --days ${{ inputs.online_days || '60' }}
      - name: Fetch in-person tournaments (limitlesstcg.com)
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run fetch:offline -- --days ${{ inputs.offline_days || '365' }}
      - name: Commit raw data cache
        if: github.event_name != 'push'
        run: |
          git add data/raw
          if git diff --cached --quiet; then echo "No new tournaments"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tournament data $(date -u +%F)"
          git push

      - run: npm run build:data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
